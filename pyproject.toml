[project]
name = "omegakit"
version = "0.7.0"
description = "Composable YAML configuration and Python object construction."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Patrick Lindemann" }, { name = "Mustafa Mohsen" }]
keywords = ["omegaconf", "yaml", "configuration", "config", "instantiation"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
requires-python = ">=3.12"
dependencies = ["omegaconf>=2.3,<2.5", "typing_extensions>=4.12"]

[project.scripts]
omegakit = "omegakit.cli:main"

[project.urls]
Homepage = "https://github.com/patrick-lindemann/omegakit"
Documentation = "https://omegakit.readthedocs.io"
Source = "https://github.com/patrick-lindemann/omegakit"
Changelog = "https://github.com/patrick-lindemann/omegakit/blob/main/CHANGELOG.md"

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.4,<10",
    "pytest-cov>=7.1,<8",
    "ruff>=0.14,<0.15",
    "pyright>=1.1.414,<1.2",
    "pydoclint>=0.9.1,<0.10",
    "jsonschema>=4.23,<5",
]
# The docs example is a PyTorch project, and PyTorch warns without NumPy. Not
# installed by default: `uv sync --group examples` adds them.
examples = ["numpy>=2", "torch>=2.9"]
docs = [
    "furo>=2025.9",
    "myst-parser>=4,<5",
    "sphinx>=8.2,<9",
    "sphinx-autodoc-typehints>=3,<4",
    "sphinx-reredirects>=1,<2",
]

[tool.uv]
default-groups = ["dev", "docs"]

# The CPU build, which is small and runs on every platform.
[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
markers = [
    "distribution: builds the wheel and tests it installed in a fresh environment",
]

[tool.coverage.run]
source = ["omegakit"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "A", "D", "SIM", "RUF", "PT", "TID"]
ignore = ["D100", "D104", "D105"]
external = ["DOC"] # pydoclint's codes, for its `# noqa` comments

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"typing.TYPE_CHECKING".msg = "Import at runtime; TYPE_CHECKING only when functionally necessary."

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
"docs/**" = ["D", "PT"]

[tool.pydoclint]
style = "google"
arg-type-hints-in-docstring = false
check-return-types = false
check-yield-types = false

[tool.pyright]
include = ["src", "tests", "docs"]
pythonVersion = "3.12" # the floor; development runs on 3.13
typeCheckingMode = "standard"
reportImplicitOverride = "error"
reportUnnecessaryTypeIgnoreComment = "error"
# The page examples import the example projects, as their tests do.
executionEnvironments = [
    { root = "docs", extraPaths = ["docs/curvefit", "docs/example"] },
]
# The PyTorch variant needs Torch, which the lint job does not install.
exclude = ["docs/curvefit/torch"]
