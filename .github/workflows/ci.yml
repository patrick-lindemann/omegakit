name: CI

# A pull request into main and a release candidate run every job. Pushes run
# nothing; on any branch, CI started by hand runs the quick jobs (lint, docs, the
# resolvers and the tests on one Python version) or, if asked, every job. The
# tests of the library install neither the docs group nor the resolvers group:
# the docs job runs the docs examples, and test-resolvers the optional resolvers.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      full:
        description: Run every job, not only the quick ones.
        type: boolean
        default: false
  workflow_call:
    inputs:
      full:
        description: Run every job, not only the quick ones.
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      # ty checks the docs example and the optional resolvers.
      - run: uv sync --locked --all-groups
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run pydoclint src
      - run: uv run ty check

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv sync --locked
      - run: uv run sphinx-build -W docs docs/_build
      - run: uv run --no-sync pytest -m docs

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: >-
          ${{ fromJSON(
            (github.event_name == 'pull_request' || inputs.full)
            && '["3.10", "3.11", "3.12", "3.13", "3.14"]' || '["3.14"]'
          ) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked --no-group docs
      - run: uv run --no-sync pytest --cov -m "not docs and not resolvers"

  test-lowest:
    if: github.event_name == 'pull_request' || inputs.full
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.10"
      # Unlocked resolutions skip the last few days of uploads, so that a compromised
      # or broken release has time to be yanked.
      - run: echo "UV_EXCLUDE_NEWER=$(date -u -d '3 days ago' +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
      - run: uv sync --resolution lowest-direct --no-group docs
      - run: >-
          uv run --no-sync pytest --cov
          -m "not distribution and not docs and not resolvers"

  test-resolvers:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Each Python version locks its own NumPy, and older Pythons and NumPys
        # expose fewer signatures to OmegaConf.
        python-version: >-
          ${{ fromJSON(
            (github.event_name == 'pull_request' || inputs.full)
            && '["3.10", "3.11", "3.12", "3.13", "3.14"]' || '["3.14"]'
          ) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked --no-group docs --group resolvers
      - run: uv run --no-sync pytest -m resolvers
