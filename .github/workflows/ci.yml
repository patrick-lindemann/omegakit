name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run pydoclint src
      - run: uv run pyright

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked
      - run: uv run sphinx-build -W docs docs/_build

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked
      - run: uv run pytest --cov

  test-lowest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - run: uv sync --resolution lowest-direct
      - run: uv run --resolution lowest-direct pytest --cov -m "not distribution"

  test-omegaconf-next:
    # The newest OmegaConf pre-release in the supported range, so that a change in
    # OmegaConf shows up here before it is released to users.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
      - run: uv sync --locked
      - run: uv pip install --prerelease allow "omegaconf>=2.4.0.dev0,<2.5"
      - run: uv run --no-sync python -c "import omegaconf; print(omegaconf.__version__)"
      - run: uv run --no-sync pytest -W error::UserWarning -m "not distribution"
