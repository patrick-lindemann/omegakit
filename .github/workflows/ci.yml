name: CI

on:
  push:
    # Tags run CI through the release workflow instead.
    branches: ["**"]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run pydoclint src
      - run: uv run pyright

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      - run: uv sync --locked
      - run: uv run sphinx-build -W docs docs/_build

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked
      - run: uv run pytest --cov

  test-lowest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: "3.12"
      # Unlocked resolutions skip the last few days of uploads, so that a compromised
      # or broken release has time to be yanked.
      - run: echo "UV_EXCLUDE_NEWER=$(date -u -d '3 days ago' +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
      - run: uv sync --resolution lowest-direct
      - run: uv run --resolution lowest-direct pytest --cov -m "not distribution"

  test-omegaconf-next:
    # The newest OmegaConf pre-release in the supported range, so that a change in
    # OmegaConf shows up here before it is released to users.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: "3.13"
      - run: uv sync --locked
      - run: >-
          uv pip install --prerelease if-necessary-or-explicit
          --exclude-newer "$(date -u -d '3 days ago' +%Y-%m-%dT%H:%M:%SZ)"
          "omegaconf>=2.4.0.dev0,<2.5"
      - run: uv run --no-sync python -c "import omegaconf; print(omegaconf.__version__)"
      - run: uv run --no-sync pytest -W error::UserWarning -m "not distribution"

  test-resolvers:
    # The resolvers for optional libraries, which the other jobs skip because the
    # libraries are not dependencies. Install each library here.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: "3.13"
      - run: uv sync --locked
      # The PyTorch index publishes no upload dates, so the three-day cutoff would
      # exclude every file on it. Only CPU Torch itself comes from there; its
      # dependencies come from PyPI, under the cutoff.
      - run: >-
          uv pip install --no-deps
          --index-url https://download.pytorch.org/whl/cpu torch
      - run: >-
          uv pip install
          --exclude-newer "$(date -u -d '3 days ago' +%Y-%m-%dT%H:%M:%SZ)" torch
      - run: uv run --no-sync pytest -m "not distribution"
