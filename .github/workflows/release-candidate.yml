name: Release candidate

# A tag such as v0.8.0-rc1 on develop runs every CI job, builds the package as
# version 0.8.0rc1 and publishes it to TestPyPI, where it can be installed and
# tried before the release. The repository is not changed.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+-rc[0-9]+"]

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    with:
      full: true
    permissions:
      contents: read

  build:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check that the tagged commit is on develop
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/develop
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.11.33"
          enable-cache: false
      # The tag gives the version: v0.8.0-rc1 builds 0.8.0rc1.
      - run: uv version --frozen "${GITHUB_REF_NAME#v}"
      - run: uv build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/omegakit/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      # Publishes with PEP 740 attestations.
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
