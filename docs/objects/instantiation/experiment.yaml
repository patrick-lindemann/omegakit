$target: experiment.Experiment
model:
  $target: torch.nn.Sequential
  $args:
    - $target: torch.nn.Linear
      in_features: 1
      out_features: 16
    - $target: torch.nn.ReLU
    - $target: torch.nn.Linear
      in_features: 16
      out_features: 1
optimizer:
  $target: torch.optim.SGD
  $partial: true
  lr: 0.1
loss:
  $symbol: torch.nn.functional.mse_loss
epochs: "50"
